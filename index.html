<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Caleb's Calculator</title>

    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="calculator" aria-label="Caleb's Calculator">
      <header class="text-center mb-4">
        <h1 class="fw-bold text-primary mb-1">Caleb's Calculator</h1>

        <p class="text-secondary small mb-0">Simple • Fast • Modern</p>
      </header>

      <section class="display" aria-live="polite">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
      </section>

      <section class="buttons" aria-label="Calculator buttons">
        <button class="clear" data-action="clear">C</button>

        <button data-action="delete" aria-label="Delete">⌫</button>

        <button
          class="operator"
          data-action="operator"
          data-value="÷"
          aria-label="Divide"
        >
          ÷
        </button>

        <button
          class="operator"
          data-action="operator"
          data-value="×"
          aria-label="Multiply"
        >
          ×
        </button>

        <button data-action="number" data-value="7">7</button>
        <button data-action="number" data-value="8">8</button>
        <button data-action="number" data-value="9">9</button>

        <button
          class="operator"
          data-action="operator"
          data-value="-"
          aria-label="Subtract"
        >
          −
        </button>

        <button data-action="number" data-value="4">4</button>
        <button data-action="number" data-value="5">5</button>
        <button data-action="number" data-value="6">6</button>

        <button
          class="operator"
          data-action="operator"
          data-value="+"
          aria-label="Add"
        >
          +
        </button>

        <button data-action="number" data-value="1">1</button>
        <button data-action="number" data-value="2">2</button>
        <button data-action="number" data-value="3">3</button>

        <button class="equals" data-action="equals">=</button>

        <button class="zero" data-action="number" data-value="0">0</button>

        <button data-action="decimal" aria-label="Decimal">.</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
